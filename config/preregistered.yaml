# The project's analytic choices. The pipeline reads values from here, never from
# hard-coded defaults. Changing any value means a different results folder (BOM-40).
#
# SCOPE OF THIS FILE AS IT STANDS: only choices already PINNED in the pre-registration
# are present. Every value below was checked against paper/preregistration.md and cites
# its section. Choices not yet registered are NOT here, even as placeholders, so that
# nothing in this file can be mistaken for a registered decision; they are named in
# `pending_amendment` at the end and must be pinned by dated OSF amendment before BOM-21.
#
# Sections for the classical methods, language models, dating, embeddings and the
# decision rules arrive with BOM-40 proper, once BOM-20 closes.

version: 0.3
preregistration: https://osf.io/6ugxc/
covers: [BOM-12, BOM-13, BOM-14, BOM-15, BOM-16, BOM-17]

corpus:
  # 4.1, 4.3
  date_range: [1780, 1830]
  sources:
    - institutional_books
    - hathitrust
    - internet_archive
    - chronicling_america
    - eebo_tcp
  # 4.3: volumes whose estimated OCR character error rate exceeds 10% are excluded.
  # Taken from the source's quality score, or our own sample-based estimate where none exists.
  ocr_max_cer: 0.10
  # 4.3: reprints and later editions collapse to the earliest edition.
  dedup:
    method: minhash
    shingle: 5
    threshold: 0.8
    keep: earliest
  # Amendment 2 (2026-10-17)
  language_filter:
    source_metadata: eng
    verify: langid
    sample_chars: 2000
    min_probability: 0.90
  # Amendment 3 (2026-10-20): multi-label, few-shot, uncertainty option, two passes.
  genre_tagging:
    labels: [sermon_devotional, pseudo_biblical, history_chronicle, fiction_narrative,
             newspaper_periodical, legal_political, scientific_medical, other]
    max_labels: 2              # primary first; a work may genuinely belong to two
    allow_uncertain: true      # better than a forced guess
    method: llm_few_shot_two_pass
    passes: 2                  # inter-pass agreement is the confidence signal
    # Amendment 4: pass 2 covers a stratified sample, not the corpus. A census measured
    # per-record consistency, which no decision rule reads -- every use of genre (5.1, 5.5,
    # 6.5) is pool-level. Pass 2 must be a different model family: at temperature 0 the same
    # model reproduced 19 of 20 of its own labels, so self-agreement measures the hardware.
    reliability_sample: 5000
    reliability_strata: [category, source, decade]   # a failure confined to one source or
                                                     # period is not category-shaped
    pass2_model_family: distinct_from_pass1
    validation_sample: 300
    validation_sampling: stratified   # over-samples ambiguous categories and disagreements
    # Amendment 4: the test that matters, because the labels are only ever used pool-wise.
    # Corrupt labels at the rate validation measures, drawn from the observed confusion
    # between categories, and recompute the genre-dependent analyses. A BOM-40 axis.
    perturbation_runs: 100
    perturbation_rate: from_validation   # not a free parameter; set by the measured error rate
    perturbation_confusion: observed     # not uniform
  spelling_normalization:
    pre_1700: morphadorner_emod_lexicon
    post_1780: artifacts_only   # long-s, ligatures, OCR; no lexical modernisation

sealing:
  # 4.2: drop any training volume containing a Book of Mormon string of >= 12 tokens.
  contamination_min_tokens: 12

kjv_mask:
  # 4.4: alignment to the KJV with passim; spans are verbatim, close paraphrase, or original.
  # Amendment 2 (2026-10-17)
  edition: kjv_1769_oxford_blayney
  verbatim:
    min_identity: 0.90
    min_tokens: 8
  paraphrase:
    min_identity: 0.60
    max_identity: 0.90
    min_tokens: 8
  # Amendment 2: passim with word 5-grams, minimum alignment 8 tokens (the min_tokens above),
  # maximum gap 100 characters, relative overlap 0.5; validated on a hand-checked sample of 200
  # alignments and frozen before any Book of Mormon text is masked. min_match is a value
  # Amendment 2 registers as a selection rule (benchmark/control data only, published before the
  # Book of Mormon is scored); it is added here once kjv_mask.evaluate has chosen it.
  passim:
    ngram: 5
    max_gap_chars: 100
    relative_overlap: 0.5
    passim_min_align_chars: 20   # pending_amendment: kjv_mask.passim_implementation
    max_df: 100                  # pending_amendment: kjv_mask.passim_implementation
    # Selected 2026-10-27 under Amendment 2's selection-rule provision on planted quotations
    # (kjv_mask.evaluate, data/kjv_mask/eval_grid.jsonl): masking F1 0.856 at every value 1-4,
    # so the registered tie-break (larger) gives 4.
    min_match: 4

segmentation:
  # 4.5: three segmentations (narrator, dictation order, scribe), each cut into fixed chunks.
  ways: [narrator, dictation_order, scribe]
  chunk_words: [2000, 5000]
  split:
    # 4.5 registers the procedure; Amendment 2 (2026-10-17) registers the seed.
    applies_to_chunk_words: 5000
    stratify_by: narrator
    seed: 20261017

# Amendment 5 (2026-10-21), OSF revision 6ad8cc455301b781d55b34dc.
# Expanded candidate corpora as a SECONDARY analysis. Section 3's corpora and section 6's
# decision rules are unchanged and remain confirmatory; H1a and H1b are decided on them alone.
# Nothing here may be substituted for the primary result, including when it is inconclusive.
candidates:
  # 3: a candidate with fewer masked words is scored, but every result carries the
  # "unreliable sample" flag and is excluded from the Bayesian synthesis.
  min_masked_words: 10000
  expanded_corpora:
    role: secondary
    # Fixed from the historical record before any scoring.
    exposure_tiers:
      none: [spalding]                                    # died 1816; no expansion possible
      exposed: [joseph_smith, cowdery, rigdon, pratt, phelps]
      unexposed: [ethan_smith, hunt, corpus_authors]
    # Exposure biases an expanded corpus toward resemblance, so the test is one-directional.
    exposed_rule: non_match_is_evidence_match_is_uninformative
    provenance_admitted: [holograph, dictated_to_scribe]
    provenance_excluded: [reported_speech, composed_or_edited_by_others]
    # No expansion for a candidate whose signal is not stable across the gap (BOM-48).
    gate: time_split_validation_at_section_7_floor
    sweep_lead_expansions_max: 10
    publish_test_counts: true

# Amendment 2 (2026-10-17). Root seed; every component seed derives from this.
seed: 20261017

# Choices these Phase 2 stages need that the pre-registration does not yet fix. Each must be
# pinned by dated amendment before BOM-21 calibration starts (BOM-40). Absent from the config
# above on purpose: an unregistered value written here would read as a registered one.
pending_amendment:
  - key: kjv_mask.passim_implementation
    issue: BOM-16
    note: >
      Amendment 2 registers passim's n-gram order, minimum alignment, gap and overlap (now in
      kjv_mask.passim; an earlier entry here for the whole parameter set was stale). Left to
      implementation: passim counts its own --min-align in characters, set to 20 so that the
      registered 8-token minimum, enforced on tokens, decides; --maxDF stays at passim's 100;
      "relative overlap 0.5" is applied to both --src-overlap and --dst-overlap; and a span
      must contain an unbroken run of matching tokens at least as long as the n-gram order.
  - key: borrowing.null_sample
    issue: BOM-45
    note: >
      6.5 fixes a floor of 500 volumes, not a number. A 99th percentile from 500 draws rests on
      about five tail observations; the chosen n follows from the variance curve in BOM-45.
  - key: genre_tagging.pass2_model
    issue: BOM-12
    note: >
      Amendment 4 requires a family distinct from pass 1 but names no model; the choice is
      measured on the ground-truth rows and published with both versions.
  - key: genre_tagging.perturbation_rate_bound
    issue: BOM-53
    note: >
      Amendment 4 sets perturbation_rate from the hand-adjudicated validation sample. BOM-53
      defers that sample: the perturbation is first run at a worst-case bound taken from the
      measured inter-model disagreement (28% on model-decided records, 3% on rule-decided,
      genre_benchmark_300.json), with the confusion drawn from the observed pass-1/pass-2
      disagreements. The hand sample is drawn only if the genre-dependent conclusions move
      under that bound. Needs a dated OSF amendment naming the bound before BOM-40 runs it.
  - key: ocr_fix.period_lexicon
    issue: BOM-14
    note: >
      The word list OCR repair consults (ocr_fix/lexicon.py): Webster's Second plus every word
      in at least 2 hand-keyed TCP ECCO/Evans texts dated 1700 or later, with each word's
      document frequency. MIN_DOCS = 2.
  - key: ocr_fix.cleaning
    issue: BOM-14
    note: >
      Rule-based cleaning thresholds (ocr_fix/clean.py): long s read as f is repaired when the
      s-form occurs in at least 100 times as many keyed texts as the form as read
      (LONG_S_RATIO); running headers are lines in the top or bottom 2 lines of a page
      (EDGE_LINES) whose letters, at least 6 of them (HEADER_MIN_LETTERS), recur there on at
      least 3 pages and 5% of pages (HEADER_MIN_PAGES, HEADER_MIN_SHARE); in text without page
      marks, lines of at most 60 characters (SHORT_LINE) against a page estimate of 2,000
      characters (CHARS_PER_PAGE). Chronicling America single pages skip header removal.
  - key: spelling_normalization.1700_1779
    issue: BOM-15
    note: >
      The registration names pre_1700 (MorphAdorner EME lexicon) and post_1780 (artifacts
      only) and is silent on 1700-1779, which is TCP's ECCO and Evans material. Treated as
      artifacts_only, the reading that changes least (ocr_fix/normalize.py regime()).
  - key: spelling_normalization.morphadorner_an
    issue: BOM-15
    note: >
      MorphAdorner's EME adorner, applied as distributed (ocr_fix/morphadorner.py), maps the
      article "an" to "and" (486 of 497 uses in one sample text, A00005), which merges a
      determiner into the most frequent conjunction in every pre-1700 text. Proposed: keep
      "an" as printed and leave every other MorphAdorner standard spelling as is. Until pinned,
      the registered method is applied unchanged and the merge is counted in
      data/normalization/applied_map.tsv. Affects only the pre-1700 reference texts.
  - key: ocr_fix.defragment
    issue: BOM-14
    note: >
      Re-segmenting newspaper text delivered with words broken apart (ocr_fix/defragment.py): a
      line is fragmented when at least 30% of its alphabetic tokens are fragments of 2 letters
      or fewer that are not common short words (FRAGMENT_SHARE, FRAGMENT_LEN); words of up to
      20 letters (MAX_WORD); a word outside the lexicon costs 12 per letter on top of the
      unknown-word cost (UNKNOWN_PER_LETTER). A split is kept only if it raises the share of
      letters in known words.
  - key: controls.pseudo_biblical_list
    issue: BOM-18
    note: >
      Amendment 3 has control sets match a work on either of its two genre labels. For the
      pseudo-biblical set that admits about 5,300 volumes in 1780-1830, read by title mostly
      ordinary religious prose (pass 1 used pseudo_biblical freely as a second label); 23 carry
      it as primary. Both lists are built (pseudo_biblical, pseudo_biblical_primary, each with
      the four works section 3 names). Which list the confirmatory pseudo-biblical test reads
      is the owner's decision, and a departure from "either" needs a dated amendment.
  - key: controls.pool_sample
    issue: BOM-18
    note: >
      The history and general-prose pools (about 40,000 and 340,000 volumes) are drawn down to
      3,000 and 5,000 by a seeded sample stratified by source and decade in proportion, so that
      every member can be KJV-masked with passim at the validated batch size (the full pools are
      about 20 billion words, a month of passim on the data machine). Amendment 2's draws of 100
      imposters per trial are unaffected in kind.
  - key: sealing.contamination_kjv
    issue: BOM-18
    note: >
      4.2's check drops a volume holding a Book of Mormon string of 12+ tokens. Read literally
      that includes the KJV chapters the Book of Mormon reproduces; run that way on the control
      pools it flagged 4,267 volumes, mostly sermons quoting Isaiah and Matthew. Implemented as
      12-token strings from the 1830 edition's original spans (outside BOM-16's KJV masks) that
      do not occur in the KJV, and a volume is contaminated when it shares at least 20 distinct
      such strings (metadata/sealed.py MIN_SHARED). Measured: no control-pool volume shares more
      than 9 (liturgy, biblical phrasing); the six copies of the book share 109,011 to 174,655.
