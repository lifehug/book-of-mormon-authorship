  gate_sample: 100
  gate_seed: bom47-gate

# Amendment 57 (Part 2): a library-wide author search (docs/part2-library-search-plan.md)
list_size:                        # Amendment 58 (BOM-90): accuracy against candidate-list length
  sizes: [2, 4, 8, 12, 20, 30, 55]
