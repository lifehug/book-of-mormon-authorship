      be_aware: [32, '\bbe\s+aware\b(?!\s+(?:of|that|how|what|whether)\b)', '\bbe\s+aware\b', 'to beware, to take care or be on guard (a warning)', 'to be conscious of or informed about something; any other sense', [Mormon, be aware lest], null]
      begin_to: [33, '\b(?:begin|begins|began|begun|beginning)\s+to\s+(?:the|a|an|this|that|his|their|our|my|its)\b', '\b(?:begin|begins|began|begun|beginning)\s+to\b', '"to" marks the starting point (begin to = begin at or begin with, followed by a noun)', '"to" begins an infinitive (began to speak), or marks a person addressed or a limit reached; any other sense', [Alma, began to the creation], null]
      belief_on: [34, '\bbelief\s+on\b', '\bbelief\b', '"on" marks what is believed in (belief on = belief in)', '"on" has another role (belief on this subject, on good grounds); any other sense', [Mosiah, belief on the words of Alma], null]
      but_if: [35, null, '\bbut\s+if\b', '"but if" meaning unless', '"but if" meaning but in case, however if; any other sense', [Mosiah, but if he yieldeth], 'no frame separates the senses: "but if" = unless and "but if" = but in case share every construction']
      do_away: [36, '\b(?:do|did|doth|done|doeth|doing)\s+(?:these|those|this|them|it|the|that)\s+(?:\w+\s+){0,2}away\b', '\bdo\s+away\b', 'to dismiss, to set aside or reject (do these things away)', 'to abolish or get rid of (do away with); to go away; any other sense', [Moroni, do these things away], null]
      for_the_cause_of: [37, '\b(?:is|was|are|were|be)\s+for\s+the\s+cause\s+of\b', '\bfor\s+the\s+cause\s+of\b', '"for the cause of" meaning because of (giving a reason)', 'on behalf of, in support of (for the cause of liberty); any other sense', [Alma, for the cause of your love], null]
      hurl_away: [38, '\bhurl(?:s|ed|ing)?\s+(?:\w+\s+){0,3}away\b', '\bhurl(?:s|ed|ing)?\b', 'to drag or draw away (souls hurled away = dragged off)', 'to throw or fling with force; any other sense', [Helaman, hurl away your souls], null]
      in_the_favor_of: [39, '\bin\s+the\s+favou?r\s+of\b', '\bfavou?r\s+of\b', '"in the favor of" meaning in favor of (in support of, deciding for)', 'in the good graces of, enjoying the favor of; any other sense', [Alma, came in the favor of the freemen], null]
      in_the_fourth_day: [40, '\bin\s+the\s+(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|\w+teenth|twentieth|thirtieth)\s+day\s+of\s+the\s+month\b', '\bday\s+of\s+the\s+month\b', '"in the Nth day" meaning on the Nth day (a date)', 'in the course of, within the period of that day; any other sense', [3 Nephi, in the fourth day of the month], null]
      into_an_effect: [41, '\binto\s+an?\s+effect\b', '\binto\s+effect\b', '"into an effect" meaning into effect (carry or bring a plan into effect)', 'into a result or consequence (an effect as a thing); any other sense', [Alma, into an effect upon them], null]
      on_the_seventh_month: [42, '\bon\s+the\s+(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth)\s+month\b', '\bmonth\b', '"on the Nth month" meaning in the Nth month (a date)', 'any other sense', [Alma, on the seventh month], null]
      search_knowledge: [43, '\bsearch(?:es|ed|ing)?\s+(?:knowledge|wisdom|understanding)\b', '\bsearch(?:es|ed|ing)?\s+(?:for|after|into)\b', '"search" with a direct object meaning seek for (search knowledge = search for knowledge)', 'search a place or thing examined (search the scriptures, search the house); any other sense', [2 Nephi, search knowledge], null]
      somewhat_contentions: [44, '\bsomewhat\s+(?:contentions?|wars?|troubles?|difficulty|difficulties|disputes?|dissensions?|quarrels?|disturbances?|commotions?|disorders?|tumults?|strifes?|divisions?|murmurings?|disagreements?|differences?)\b', '\bsomewhat\s+of\b', '"somewhat" before a noun meaning some, a certain amount of (somewhat contentions = some contentions)', 'somewhat as an adverb (to some degree); any other sense', [Words of Mormon, somewhat contentions], null]
      strong_hold: [45, '\bstrong(?:er|est)\s+hold\b', '\bstrong\s*holds?\b', '"strong hold" as an adjective and noun (a hold that is strong; strongest hold = the strongest of the holds)', 'a stronghold as one compound noun (a fortress), or hold as a grip; any other sense', [Helaman, strongest hold in all the land], null]
      to_that: [46, '\b(?:even\s+)?to\s+that\s+(?:they|he|she|we|ye|i|it|the)\s+(?:did|were|was|had|could|would|should|might)\b', '\bto\s+that\b', '"to that" as a conjunction meaning until, to the point that', '"to" + "that" as a pronoun or determiner (added to that, to that place); any other sense', [1 Nephi, even to that they did forget], null]
      where_unto: [47, '\bwhere\s?unto\s+(?:thou|ye|you|he|they|we|i)\s+(?:hast|hath|have|has|art|had)\s+not\b', '\bwhere\s?unto\b', '"whereunto" meaning with respect to which, whereas', 'to which, to what place or purpose; any other sense', [Ether, whereunto thou hast not made us], null]
  emode:                           # BOM-119 (lab; exploratory): Carmack's early modern syntax rates against the library
    min_words: 5000                # a library work needs this many words
    min_past: 50                   # and this many past-tense contexts for its did-rate to count
    year_min: 1500
    year_max: 1830
    match_years: [1780, 1830]      # "how many works match or exceed it"
    after_years: [1700, 1830]      # "outside everything after 1700"
    early_years: [1540, 1620]      # known answer (b): EEBO-TCP works, high periphrastic did
    late_years: [1760, 1830]       # known answer (b): library works, low periphrastic did
    auc_sample: 300                # works drawn for each side of (b)
    auc_bar: 0.80                  # (b): AUC of the did-rate
    profile_auc_bar: 0.75          # (b): AUC of the mean per-feature percentile rank
    handcheck: 60                  # known answer (c): periphrastic hits read by hand
    precision_bar: 0.90
    published: {bom: 0.202, kjv: 0.017}   # Skousen and Carmack 2018 (NOL 566, 570)
    bom_tolerance: 0.03            # known answer (a): absolute, in rate
    kjv_tolerance: 0.007
    did_window: 3                  # most tokens between did and its verb
    lexicon_sample: 1500           # library works read for the verb lexicon
    lexicon_min: 5                 # times after a modal for a word to count as a verb
    lexicon_share: 0.005           # and that share of all its uses (0.02 first; lowered after the first Book of Mormon count, see the card)
    reprint_death_before: 1700     # an author string with a death year before this marks a reprint
    reprint_birth_before: 1650
    workers: 8
    part_size: 500                 # works per part file of the library pass (order shuffled by seed)
    seed: 20261120
  # Rule sets: what a kind of test may use. Each is a list of conditions on the registry's columns;
  # a test names one, and the results record it. "any" = one of; "min"/"max" = a range; a bare
  # value = equal to.
  views:
    everything: {}
    readable: {has_text: true}
    borrowing:                    # the passage index's own eligibility: what the borrowing tests searched
      {in_passage_index: true}
    work-search:                  # any single book of the period, anonymous ones included
      {has_text: true, kind: work, dup_keeper: true, ocr_excluded: false, year: {min: 1780, max: 1830}, words: {min: 5000}}
    author-search:                # the library search as run: swept authors not known dead or under age in 1829
      {author_swept: true, author_life: {any: [alive, unknown]}, training: {any: [train, validation]}}
    author-search-all-lives:      # the same with dead authors kept in, as decoys
      {author_swept: true, training: {any: [train, validation]}}
    known-answer:                 # books by authors no style model was trained on: for measuring accuracy
      {author_style_split: heldout, has_text: true, dup_keeper: true}
    unseen-by-models:             # text no language model here was trained on
      {has_text: true, training: none}
    newspapers: {kind: newspaper_page, has_text: true}
