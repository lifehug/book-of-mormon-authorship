      judged:                      # the model's readings of step 1 (simulated judging; card section 2026-11-23, written before scoring)
        rating_level: {SAME: 0, RELATED: 1, DISTANT: 2}   # model's gloss rating set beside the rule's meaning level
    shuffles: 10000                # meaning permutations per test (Kessler)
    alpha: 0.01                    # detection and target bar (one-sided, permutation p)
    decoy_alpha: 0.05              # hard decoys must give p above this
    min_meanings: 20               # a list shorter than this is not attempted
    loan_values: ['1. clearly borrowed', '2. probably borrowed']   # WOLD codes removed as loans (Yaqui's Spanish loans)
    borrow_parts: 3                # meanings split into thirds by WOLD Borrowed_score; skew = most borrowable minus least
    skew_margin: 0.0               # z(most borrowable third) - z(least) must exceed this for "the borrowable-end skew"
    planted:                       # power: synthetic regular non-identical loans planted in each negative pair
      plantings: 200
      shuffles: 2000               # permutations per planting
      bar: 0.8                     # detected (p < alpha) in at least this share
      fractions: [1.0, 0.5, 0.25]  # of k (k = list meanings Stubbs's Appendix B claims); the bar applies to 1.0
    known_answer:                  # list sizes matched to each target by seeded subsampling
      inherited: [[nel:heb, nel:arb]]
      contact: [[nel:fin, nel:lit], [nel:fin, nel:lav], [nel:fin, nel:swe], [nel:eus, nel:spa], [nel:eng, nel:fra], ['wold:Yaqui+loans', nel:spa]]
      finnish: [0, 1, 2]           # indexes of the Finnish pairs in contact; at least one must pass
      contact_needed: 4            # of the six at p < alpha, each with the skew
      negative: [[wold:Yaqui, nel:fin], [wold:Yaqui, nel:jpn], [wold:Yaqui, nel:tam], [wold:Yaqui, nel:eus], [wold:Yaqui, nel:kat], [wold:Yaqui, nel:hun], [wold:Yaqui, nel:kor], [wold:Yaqui, wold:ImbaburaQuechua]]
      negative_max: 1              # of the eight at p < alpha
      decoys: [[nel:jpn, nel:heb], [nel:jpn, nel:tam]]
    targets:                       # Holm across these; gh:* = the 46 Greenhill et al. varieties together (Kessler-Lehtonen sum)
      yaqui_biblical_hebrew: [wold:Yaqui, oshl:heb]
      yaqui_coptic: [wold:Yaqui, cdo:cop]
      yaqui_late_egyptian: [wold:Yaqui, asjp:LATE_EGYPTIAN]
      greenhill_biblical_hebrew: ['gh:*', oshl:heb]
      greenhill_arabic: ['gh:*', nel:arb]
      greenhill_aramaic: ['gh:*', asjp:ARAMAIC_ANCIENT]
      greenhill_late_egyptian: ['gh:*', asjp:LATE_EGYPTIAN]
      greenhill_coptic: ['gh:*', asjp:COPTIC]
      pua_biblical_hebrew: [asjp:PROTO_UTO_AZTECAN, asjp:BIBLICAL_HEBREW]
      pua_aramaic: [asjp:PROTO_UTO_AZTECAN, asjp:ARAMAIC_ANCIENT]
      pua_late_egyptian: [asjp:PROTO_UTO_AZTECAN, asjp:LATE_EGYPTIAN]
      pua_coptic: [asjp:PROTO_UTO_AZTECAN, asjp:COPTIC]
    trap: ['wold:Yaqui+loans', oshl:heb]   # leakage trap: Spanish loans left in, reported beside, not in Holm
    vocabulary:                    # their way from Stubbs's Comparative Vocabulary (2011; revised online ed. 2020), card section 2026-11-23
      pua_consonants: [p, t, k, kw, "’", h, s, c, m, n, L, w, y]   # his "mostly secure" PUA consonants, printed p. 12
      branches:                    # his Table 3 (printed p. 3): language abbreviation -> branch
        Num: [Mn, NP, TSh, Sh, WSh, Cm, Kw, Ch, SP, WMU, CU, NU]
        Hp: [Hp]
        Tb: [Tb]
        Tak: [Ls, Ca, Cp, Sr, Gb, Ktn]
        Tep: [TO, UP, Nv, LP, PYp, PYc, NT, ST]
        Opn: [Eu, Op]
        Tbr: [Tbr]
        Cah: [Yq, AYq, My]
        Trn: [Wr, Tr, WTr]
        CrC: [Cr, Wc]
        Azt: [CN, Pl, HN]
      min_consonants: 2            # a word with fewer mapped consonants is not scored (step 3)
      semitic_columns: [kw, p]     # his Appendix A (2015) columns applied to Semitic lists and controls
      egyptian_columns: [e]
      semitic_lists: ['oshl:heb', 'nel:heb', 'nel:arb']   # the first is primary
      egyptian_lists: ['cdo:cop']
      control_lists: ['nel:fin', 'nel:jpn', 'nel:tam', 'nel:eus', 'nel:kat', 'nel:hun', 'nel:kor', 'wold:ImbaburaQuechua']
      ipa_symbols:                 # IPA consonant (modifiers stripped except ˤ) -> his Semitic symbol; same for every language; unlisted = word not scored
        {p: p, f: p, ɸ: p, b: b, v: b, β: b, t: t, ʈ: t, d: d, ɖ: d, tˤ: ṭ, ðˤ: ṭ, dˤ: ṣ, sˤ: ṣ,
         k: k, c: k, g: g, ɟ: g, q: q, x: x, χ: x, ç: x, ɣ: ġ, ħ: ђ, ʕ: ʕ, ʔ: ’, h: h, ɦ: h,
         m: m, n: n, ɲ: n, ɳ: n, ŋ: n, ɴ: n, l: l, ɭ: l, ʎ: l, ɫ: l, r: r, ɾ: r, ɻ: r, ɹ: r, ʀ: r, ʁ: r,
         s: s, ɕ: s, z: z, ʑ: z, ʒ: z, ʐ: z, ʃ: š, ʂ: š, θ: θ, ð: đ, ts: ṣ, dz: z, tʃ: š, tɕ: š,
         dʒ: g, dʑ: g, j: y, ʝ: y, w: w, ʋ: w, ɥ: w}
      rerun:                       # card section "Rerun to settle the Modern Hebrew lead" (2026-11-23)
        min_branches: 2            # a vocabulary set is used only if attested in at least this many branches
        pair_choice: most_branches_then_lowest_number   # one UA set per meaning, chosen before any list
        lead: 'nel:heb'            # holds only if p < alpha and excess above every control's (Semitic rules)
        modern_merge: {"ʕ": "’", "ђ": k, x: k, q: k, "ṭ": t, "ś": s, w: b}   # Modern Hebrew mergers, for the Biblical-era check
  # Rule sets: what a kind of test may use. Each is a list of conditions on the registry's columns;
  # a test names one, and the results record it. "any" = one of; "min"/"max" = a range; a bare
  # value = equal to.
  views:
    everything: {}
    readable: {has_text: true}
    borrowing:                    # the passage index's own eligibility: what the borrowing tests searched
      {in_passage_index: true}
    work-search:                  # any single book of the period, anonymous ones included
      {has_text: true, kind: work, dup_keeper: true, ocr_excluded: false, year: {min: 1780, max: 1830}, words: {min: 5000}}
    author-search:                # the library search as run: swept authors not known dead or under age in 1829
      {author_swept: true, author_life: {any: [alive, unknown]}, training: {any: [train, validation]}}
    author-search-all-lives:      # the same with dead authors kept in, as decoys
      {author_swept: true, training: {any: [train, validation]}}
    known-answer:                 # books by authors no style model was trained on: for measuring accuracy
      {author_style_split: heldout, has_text: true, dup_keeper: true}
    unseen-by-models:             # text no language model here was trained on
      {has_text: true, training: none}
    newspapers: {kind: newspaper_page, has_text: true}
