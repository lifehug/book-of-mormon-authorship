# The project's analytic choices. The pipeline reads values from here, never from
# hard-coded defaults. Changing any value means a different results folder (BOM-40).
#
# SCOPE OF THIS FILE AS IT STANDS: only choices already PINNED in the pre-registration
# are present. Every value below was checked against paper/preregistration.md and cites
# its section. Choices not yet registered are NOT here, even as placeholders, so that
# nothing in this file can be mistaken for a registered decision; they are named in
# `pending_amendment` at the end and must be pinned by dated OSF amendment (Amendments 7 and 8,
# 2026-10-30, registered those of Phase 3).
#
# Sections for the classical methods, language models, dating, embeddings and the
# decision rules arrive with BOM-40 proper, once BOM-20 closes.

version: 0.3
preregistration: https://osf.io/6ugxc/
covers: [BOM-12, BOM-13, BOM-14, BOM-15, BOM-16, BOM-17]

corpus:
  # 4.1, 4.3
  date_range: [1780, 1830]
  sources:
    - institutional_books
    - hathitrust
    - internet_archive
    - chronicling_america
    - eebo_tcp
  # 4.3: volumes whose estimated OCR character error rate exceeds 10% are excluded.
  # Taken from the source's quality score, or our own sample-based estimate where none exists.
  ocr_max_cer: 0.10
  # 4.3: reprints and later editions collapse to the earliest edition.
  dedup:
    method: minhash
    shingle: 5
    threshold: 0.8
    keep: earliest
    # Amendment 6 (2026-10-27): a second pass across sources, since independent OCR of one
    # work never reaches the MinHash threshold. Same normalised title, author and year in
    # different sources form a group; earliest kept; nothing deleted (BOM-55).
    metadata_pass:
      keys: [title_norm, author_norm, year]
      across_sources: true
      keep: earliest
  # Amendment 6 (2026-10-27): OCR cleaning (ocr_fix.clean, ocr_fix.lexicon, ocr_fix.defragment)
  ocr_cleaning:
    lexicon_min_docs: 2          # period lexicon: Webster plus words in >= 2 keyed TCP texts
    long_s_ratio: 100
    edge_lines: 2
    header_min_letters: 6
    header_min_pages: 3
    header_min_share: 0.05
    short_line: 60
    chars_per_page: 2000
    defragment_fragment_share: 0.3
    defragment_fragment_len: 2
    defragment_max_word: 20
    defragment_unknown_per_letter: 12
    llm_correction: false        # tested (BOM-14): improves the median, inserts text
  # Amendment 2 (2026-10-17)
  language_filter:
    source_metadata: eng
    verify: langid
    sample_chars: 2000
    min_probability: 0.90
  # Amendment 3 (2026-10-20): multi-label, few-shot, uncertainty option, two passes.
  genre_tagging:
    labels: [sermon_devotional, pseudo_biblical, history_chronicle, fiction_narrative,
             newspaper_periodical, legal_political, scientific_medical, other]
    max_labels: 2              # primary first; a work may genuinely belong to two
    allow_uncertain: true      # better than a forced guess
    method: llm_few_shot_two_pass
    passes: 2                  # inter-pass agreement is the confidence signal
    # Amendment 4: pass 2 covers a stratified sample, not the corpus. A census measured
    # per-record consistency, which no decision rule reads -- every use of genre (5.1, 5.5,
    # 6.5) is pool-level. Pass 2 must be a different model family: at temperature 0 the same
    # model reproduced 19 of 20 of its own labels, so self-agreement measures the hardware.
    reliability_sample: 5000
    reliability_strata: [category, source, decade]   # a failure confined to one source or
                                                     # period is not category-shaped
    pass2_model_family: distinct_from_pass1
    validation_sample: 300
    validation_sampling: stratified   # over-samples ambiguous categories and disagreements
    # Amendment 4: the test that matters, because the labels are only ever used pool-wise.
    # Corrupt labels at the rate validation measures, drawn from the observed confusion
    # between categories, and recompute the genre-dependent analyses. A BOM-40 axis.
    perturbation_runs: 100
    perturbation_rate: from_validation   # not a free parameter; set by the measured error rate
    perturbation_confusion: observed     # not uniform
    # Amendment 6 (2026-10-27): as run.
    pass2_model: claude_sonnet
    perturbation_rate_bound: {model_decided: 0.28, rule_decided: 0.03}   # worst case first
  spelling_normalization:
    pre_1700: morphadorner_emod_lexicon
    post_1780: artifacts_only   # long-s, ligatures, OCR; no lexical modernisation
    # Amendment 6 (2026-10-27)
    range_1700_1779: artifacts_only
    morphadorner: adorner_as_distributed      # POS tagging, then standard spelling
    morphadorner_keep_printed: [an, whether, fall]   # word for word, not spelling for spelling

sealing:
  # 4.2: drop any training volume containing a Book of Mormon string of >= 12 tokens.
  contamination_min_tokens: 12
  # Amendment 6 (2026-10-27): strings from the 1830 edition's original spans, not in the KJV;
  # contaminated at >= 20 distinct shared strings (metadata.sealed).
  contamination_excludes_kjv: true
  contamination_min_shared: 20

kjv_mask:
  # 4.4: alignment to the KJV with passim; spans are verbatim, close paraphrase, or original.
  # Amendment 2 (2026-10-17)
  edition: kjv_1769_oxford_blayney
  verbatim:
    min_identity: 0.90
    min_tokens: 8
  paraphrase:
    min_identity: 0.60
    max_identity: 0.90
    min_tokens: 8
  # Amendment 2: passim with word 5-grams, minimum alignment 8 tokens (the min_tokens above),
  # maximum gap 100 characters, relative overlap 0.5; validated on a hand-checked sample of 200
  # alignments and frozen before any Book of Mormon text is masked. min_match is a value
  # Amendment 2 registers as a selection rule (benchmark/control data only, published before the
  # Book of Mormon is scored); it is added here once kjv_mask.evaluate has chosen it.
  passim:
    ngram: 5
    max_gap_chars: 100
    relative_overlap: 0.5
    # Amendment 6 (2026-10-27): implementation details (kjv_mask.align, kjv_mask.run)
    passim_min_align_chars: 20
    max_df: 100
    batch_words: 720000
    piece_words: 150000
    piece_overlap: 500
    split_parts: 3
    split_depth: 2
    # Selected 2026-10-27 under Amendment 2's selection-rule provision on planted quotations
    # (kjv_mask.evaluate, data/kjv_mask/eval_grid.jsonl): masking F1 0.856 at every value 1-4,
    # so the registered tie-break (larger) gives 4.
    min_match: 4

segmentation:
  # 4.5: three segmentations (narrator, dictation order, scribe), each cut into fixed chunks.
  ways: [narrator, dictation_order, scribe]
  chunk_words: [2000, 5000]
  split:
    # 4.5 registers the procedure; Amendment 2 (2026-10-17) registers the seed.
    applies_to_chunk_words: 5000
    stratify_by: narrator
    seed: 20261017

# Amendment 5 (2026-10-21), OSF revision 6ad8cc455301b781d55b34dc.
# Expanded candidate corpora as a SECONDARY analysis. Section 3's corpora and section 6's
# decision rules are unchanged and remain confirmatory; H1a and H1b are decided on them alone.
# Nothing here may be substituted for the primary result, including when it is inconclusive.
candidates:
  # 3: a candidate with fewer masked words is scored, but every result carries the
  # "unreliable sample" flag and is excluded from the Bayesian synthesis.
  min_masked_words: 10000
  # Amendment 43 (OSF revision 6af34a69306be72514826e10; post hoc; owner's decision): Book of Mormon
  # quotations are dropped from candidate samples, nothing else. A quotation is a passage of
  # shared runs (each at least ngram words, gaps of at most max_gap words merged) at least
  # min_words long, written after the matching passage was dictated (eval.bom_overlap).
  bom_quotation: {ngram: 8, min_words: 20, max_gap: 5}
  # Amendment 45 (OSF revision 6af3671e7cdd292b665e9bc8; post hoc, after the simulated reviews): ranking
  # rechecked with every model given the same amount of text (the revelation sample's training
  # tokens), slices seeded per unit
  dose_check: {slices: 2, seed: a45-dose}
  expanded_corpora:
    role: secondary
    # Fixed from the historical record before any scoring.
    exposure_tiers:
      none: [spalding]                                    # died 1816; no expansion possible
      exposed: [joseph_smith, cowdery, rigdon, pratt, phelps]
      unexposed: [ethan_smith, hunt, corpus_authors]
    # Exposure biases an expanded corpus toward resemblance, so the test is one-directional.
    exposed_rule: non_match_is_evidence_match_is_uninformative
    provenance_admitted: [holograph, dictated_to_scribe]
    provenance_excluded: [reported_speech, composed_or_edited_by_others]
    # No expansion for a candidate whose signal is not stable across the gap (BOM-48).
    gate: time_split_validation_at_section_7_floor
    sweep_lead_expansions_max: 10
    publish_test_counts: true

# 5.1 and Amendment 2 (2026-10-17): classical stylometry (classic/; BOM-20, BOM-21)
classic:
  mfw: [100, 300, 1000]          # most frequent words after masking
  mfw_min_doc_fraction: 0.20     # cull words in fewer than 20% of documents
  char_ngrams: [3, 4]
  pos_ngrams: [2, 3]
  content_words: true            # nouns, verbs, adjectives (Huang, Murakami & Grieve)
  distances: [burrows_delta, cosine_delta]
  imposters:                     # Amendment 2
    trials: 100
    feature_fraction: 0.5
    imposter_fraction: 0.5
    per_trial: 100               # resampled from the genre-matched control pool
    distance: cosine_delta
  ensc:                          # Amendment 2: selected by 10-fold CV on the Phase 3 benchmark
    shrinkage_grid: [0, 0.5, 1, 2, 4, 8]
    selection: cv10_open_set_accuracy
    # Amendment 7 Change 4: alpha is the largest giving at most a 5% false-"none" rate on the
    # benchmark, calibrated by BOM-21 into data/benchmark/thresholds.json. alpha_demo is only for
    # runs that set no threshold (BOM-20's demonstration).
    alpha_demo: 0.05
    priors: proportional
  # BOM-20's demonstration on the frozen corpus: known authors only, feeds no decision.
  corpus_run:
    authors: 30
    min_works: 4
    sample_words: 5000           # one registered-length chunk from the middle of each work

# 5.5 and 6.5: rare-phrase scoring and its null (BOM-24, BOM-45)
borrowing:
  ngram: 4
  max_df: 5                      # a shared 4-gram counts when in at most 5 corpus documents
  null_percentile: 99
  null_min_volumes: 500          # 6.5's floor; met by the whole corpus (Amendment 7 Change 6)
  # registered: Amendment 7 Change 6 (the null is the whole eligible period corpus)
  per_words: 10000               # length normalisation: rare shared 4-grams per 10,000 words
  # registered: Amendment 8 Change 3 (post hoc). Document frequency counts texts, copies found
  # by content (reuse.rare.copy_clusters); the by-volume count is reported beside it.
  df_by_text: true
  copy_jaccard: 0.8              # shared-gram Jaccard at which two volumes are one text
  copy_min_hits: 10              # volumes sharing fewer target grams are not compared
  copy_index_df: 20              # candidate pairs from grams in at most this many volumes
  copy_min_common: 5             # ... sharing at least this many of them
  # Amendment 13 (BOM-24; OSF revision 6ae7978847ce2102d62394f9; docs/rare-plan.md; post hoc): intervals
  block_words: 1000              # the masked target resampled in blocks of this many words
  bootstrap: 1000
  bootstrap_seed: bom24-boot
  null_sizing:
    sizes: [500, 1000, 2000, 5000, 10000, 20000]
    draws: 1000
    tolerance: 0.10              # smallest n whose 95% interval is within +/-10% of the threshold

# Section 7: minimum sample = smallest size at which closed-set accuracy stays >= 80% (BOM-43)
power:
  target_accuracy: 0.80
  # registered: Amendment 7 Changes 1-2 (the measurement design below)
  sizes: [1000, 2000, 5000, 10000, 20000]
  fixed_test_words: 5000         # the registered chunk length (4.5)
  trials: 20
  min_reference_blocks: 5
  # measured by eval.power (BOM-43), the stricter of the two known-author sets; part of
  # registered by Amendment 7 Change 2
  reference_floor_words: {burrows_delta: 10000, cosine_delta: 10000, general_imposters: 10000, ensc: 10000}

# Section 7 and 6.1: the validation benchmark (BOM-21)
benchmark:
  test_words: 5000               # 7: closed-set accuracy on 5,000-word samples
  pass_closed_set: 0.90          # 7
  max_open_set_fpr: 0.05         # 6.1 and 7
  open_set_accept: 0.95          # Amendment 25 (post hoc): match threshold = score 95% of true authors reach
  # registered: Amendment 7 Change 8
  trials: 20
  min_reference_blocks: 5
  ensc_alpha_grid: [0.000001, 0.00001, 0.0001, 0.001, 0.01, 0.05, 0.1, 0.2, 0.3, 0.5]

# Amendment 5 Change 4: time-split validation (BOM-48), the gate on expanded corpora (BOM-49)
timesplit:
  # registered: Amendment 7 Change 5
  authors: 30
  min_words: 10000               # each side, BOM-43's reference floor
  min_gap_years: 7

# Amendment 6 (2026-10-27): control sets (metadata.controls; BOM-18, BOM-54)
controls:
  pool_sample: {history: 3000, general_prose: 5000}   # seeded, stratified by source x decade
  pseudo_biblical: curated     # BOM-54 procedure; either-label and primary-label lists are
                               # sensitivity analyses

# Amendment 2 (2026-10-17). Root seed; every component seed derives from this.
seed: 20261017

# Choices these Phase 2 stages need that the pre-registration does not yet fix. Each must be
# pinned by dated amendment before BOM-21 calibration starts (BOM-40). Absent from the config
# above on purpose: an unregistered value written here would read as a registered one.
# Registered by Amendment 7 (OSF revision 6ae500f8f0e01c4f4105c6bd, 2026-10-30): power.design,
# classic.ensc.alpha, timesplit.design, borrowing.null_sample, synthesis.imitation_weights,
# benchmark.design, benchmark.imposter_fill.
# Registered by Amendment 8 (OSF revision 6ae55e1b828dc3df8274a024, 2026-10-30):
# synthesis.delta_closed_set_only, repair.design, borrowing.df_by_text, improvements.design.
# BOM-58 repair or retire (Amendment 8 Change 2; docs/repair-plan.md) and the BOM-60 improvement
# study (Change 4; docs/improvement-plan.md, not used on the Book of Mormon)
repair:
  fresh_authors: 30
  gi_feature_fraction: 0.3
  gi_trials: 1000                # BOM-60 improvement 4
  ensc_lambda_grid: [1.5, 2, 3, 4, 5, 6, 8]

# Registered by Amendment 9 (OSF revision 6ae61ebeebfd59a7464e8fc4, 2026-10-31):
# known_answer.design (docs/known-answer-plan.md; BOM-61)
known_answer:
  separation_p: 0.01             # exact one-sided Mann-Whitney p, 3 presented-as-ancient vs 9 genuine

# Registered by Amendment 10 (OSF revision 6ae620454ae19487e2bde267, 2026-10-31): exact reuse
# (5.5, BOM-23; docs/reuse-plan.md). passim's alignment settings are kjv_mask.passim's (Amendment 2)
reuse:
  min_seeds: 4                   # shared 5-grams to seed an alignment (kjv_mask.passim.min_match)
  seed_max_df: 100               # document frequency across the whole search (passim's default cap)
  matched_volumes: 2000          # known-answer score: volumes per draw
  window_years: 70               # ... printed in the 70 years before the text's English was written
  matched_draws: 3
  sermon_seed: bom23-sermon      # the 1820s sermon collection for the reference table
  english_year:                  # the year each text's English was written
    bom: 1829
    twelve_patriarchs: 1581
    enoch: 1821
    apocryphal_nt: 1726
    josephus: 1737
    koran: 1734
    herodotus: 1791
    homer: 1715
    hesiod: 1812
    sacontala: 1789
    ossian: 1760
    rowley: 1768
    jasher: 1751
    ireland_papers: 1795
    otranto: 1764
  late_war_year: 1816

# Registered by Amendment 11 (OSF revision 6ae62f2ca50d25933c296d01, 2026-10-31): the King James
# italics test (BOM-62; docs/italics-plan.md)
italics:
  bootstrap: 10000               # resamples over spans
  bootstrap_seed: bom62-boot
  check_words: 100               # italic words checked against the 1828 Phinney page images
  check_seed: bom62-italics
  min_italic_words: 50           # for an Amendment 9 text to be scored
  independent:                   # translation text only; ranges recorded before counting
    - internet_archive:isaiahnewtransla01lowt
    - internet_archive:isaiahnewtransla02lowt
    - internet_archive:bim_eighteenth-century_a-new-translation-of-isa_1790
    - institutional_books:AH5KIN
    - internet_archive:bim_eighteenth-century_a-new-translation-of-the_1782

dates:
  # Amendment 12 (BOM-64; OSF revision 6ae768b9883b4fc0e7bde25d): volumes whose own text names
  # years later than their catalog year
  latest_year: 1949             # later four-digit numbers are stamps, call numbers, OCR noise
  slack_years: 2                # a mention is "later" past catalog year + this
  min_later_mentions: 10
  min_later_share: 0.20         # of all year mentions in the volume
  min_year_mentions: 3          # corrected year: latest year mentioned at least this often
  check_size: 100               # each of flagged and unflagged-with-a-later-mention
  check_seed: bom64-dates

semantic:
  # Amendment 14 (BOM-25; OSF revision 6ae7bc3c227eb64c6abde258; docs/semantic-plan.md): index and search
  # Amendment 20 (OSF revision 6aeb6364388d19d44e80bc2f, post hoc): the retelling controls leave out
  # reuse.exact.MISSED_OWN_COPIES; both computations reported
  # Amendment 21 (OSF revision 6aec8dd3dd216354e1f383cc): named sources' null scored directly (semantic.search null)
  index_model: BAAI/bge-small-en-v1.5
  half_precision: true
  max_tokens: 512
  passage_words: 128            # consecutive whitespace words of the normalised text, no overlap
  min_passage_words: 32         # a shorter last passage is dropped
  shard_volumes: 1000           # build checkpoint; does not change any vector
  batch_size: 64                # embedding batch; measured fastest on the M4
  keep: 100                     # nearest passages stored per query (exact search)
  null_passages: 10000          # per target window; a parallel beats the query's best of these
  max_query_kjv_share: 0.5      # query passages scored in s(T, v)
  null_volumes: 500             # same window, genre and length within a factor of 2
  null_length_factor: 2
  bootstrap: 10000
  bootstrap_seed: bom25-boot
  null_seed: bom25-null

skeleton:
  # Amendment 15 (BOM-25; OSF revision 6ae7dbb60fa5f3ec4abde26d; docs/skeleton-plan.md)
  extract_model: claude-sonnet-5-5   # hosted (owner, 2026-11-01); model-assisted, simulated
  block_words: 2000             # every text cut into consecutive blocks of at most this
  max_events: 12                # per block, names replaced by roles
  check_chapters: 20            # King James narrative chapters, extracted twice
  check_seed: bom25-skeleton-check
  check_min_agreement: 0.6      # median share of events the two runs align
  check_min_supported: 0.9      # share of events a reader call finds in the chapter
  event_match_quantile: 0.99    # of cosines between events of unrelated check chapters
  match_score: 1.0              # Smith-Waterman
  mismatch_score: -0.5
  gap_score: -0.5
  shuffles: 1000
  shuffle_seed: bom25-skeleton
  max_order_p: 0.01
  control_unrelated: 20         # same-length unrelated books per retelling control
  top_search_sources: 20


timelocked_lm:
  # Amendment 2 (OSF revision 6ad3f82fc8f5176e336b2561): sizes, tokenizer, training
  pilot_params: 125000000
  base_params: 300000000
  tokenizer: byte_level_bpe
  vocab_size: 32000
  context_length: 1024
  epochs: 1                     # one pass over the deduplicated training set
  optimizer: adamw
  schedule: cosine
  peak_lr: 3.0e-4
  warmup_share: 0.02
  finetune_epochs: 3
  finetune_lr: 1.0e-5
  # Amendment 16 (BOM-27; OSF revision 6ae7e7682a1c00cdd1bde281; docs/timelocked-plan.md)
  validation_share: 0.005       # of training-set volumes, held out for validation loss
  validation_seed: bom27-validation
  tokenizer_sample_bytes: 1000000000   # seeded sample of training volumes the BPE is fit on
  tokenizer_seed: bom27-tokenizer
  pilot_shape: {layers: 14, width: 768, heads: 12}     # 124.5M parameters with the 32k vocabulary
  base_shape: {layers: 24, width: 960, heads: 15}      # 297M parameters (registered: 300M, within 100-300M)
  large_shape: {layers: 32, width: 1600, heads: 25}    # Amendment 26: 1,035,878,400 parameters, 8 H100s
  mid_shape: {layers: 28, width: 1280, heads: 20, qk_norm: true}  # Amendment 39: the 1B was unstable; ~590M with QK-norm
  mid_lr_scale: 0.8333           # Amendment 39: peak 2.5e-4 for the mid size (registered 3e-4 x 0.8333)
  batch_tokens: 524288          # 512 sequences of 1,024 tokens per optimizer step
  adam_betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip: 1.0
  min_lr_share: 0.1             # cosine floor, share of peak
  precision: bf16
  eval_every_steps: 1000
  eval_tokens: 20000000
  train_seed: bom27-train

alm:
  # Amendment 22 (OSF revision 6aed5219b9cd9627025f6179; docs/alm-plan.md): ALMs on the benchmark
  holdout_share: 0.25           # of a testable author's 1,000-word blocks, the tail, at least 5
  max_tests: 20                 # distinct held-out windows per author (benchmark.trials)
  test_seed: bom28-alm-tests
  train_seed: bom28-alm-train
  fold_seed: benchmark-alm-fold
  seq: 1024                     # fine-tuning sequence length (non-overlapping)
  batch: 8
  score_window: 512             # 5.2: fixed 512-token windows, averaged
  precision: fp32
  # Amendment 23 (OSF revision 6aed57846119836b77b6964f): secondary variants, both sizes
  v1_finetune_lr: 1.0e-4        # V1: Amendment 22 with ten times the learning rate
  v2_head_window: 512           # V2: classifier head on mean final hidden state per window
  v3_block_words: 1000          # V3: base-model hidden states per block, benchmark trials as BOM-21
  # Amendment 41 (OSF revision 6af21b8307a440edd15fb142; post hoc, after the 590M V1/V2): each size's
  # V1 and V2 learning rate chosen on held-out training text, never the benchmark tests
  lr_select_grid: [1.0e-6, 3.0e-6, 1.0e-5, 3.0e-5, 1.0e-4]
  lr_select_val_share: 0.1      # the tail of each author's training tokens (V1) or windows (V2)
  # Amendment 42 (OSF revision 6af2372b1b761e5f3180bc26; post hoc: V2 rerun 0.900 -> 0.764 at 125M)
  v2_seed_runs: 5               # V2 rerun with seeds 1..5 per size; its spread reported
  # Amendment 30 (OSF revision 6aee229330296560945f60f4): candidate and control models, BOM-28
  control_words: 300000         # seeded sample per control group, the order of the largest candidate
  control_passage_words: 5000   # at least this many middle words from every volume used
  control_seed: bom28-alm-controls

style_embed:
  # Amendment 24 (OSF revision 6aed5e35c13cfd892df383af; docs/style-embed-plan.md): BOM-30
  corporate: [anonymous, anon, unknown, united states, great britain, congress, parliament, society,
              church, committee, convention, assembly, association, company, college, university,
              board of, council, legislature, court]
  work_title_words: 6
  min_works: 2
  max_works: 16
  passages_per_work: 32
  passage_tokens: 128
  episode_passages: 8
  heldout_share: 0.10
  heldout_seed: bom30-heldout
  passage_seed: bom30-passages
  dim: 512
  authors_per_step: 64
  temperature: 0.05
  lr_encoder: 2.0e-5
  lr_head: 1.0e-3
  weight_decay: 0.01
  warmup_steps: 500
  steps: 20000
  min_lr_share: 0.1
  train_seed: bom30-train
  validate_every: 1000

dating:
  # 5.3, 6.4; Amendment 2 (multinomial logistic regression over a literature-drawn grammatical
  # feature list, 10,000 permutations); Amendment 17 (BOM-29; OSF revision
  # 6ae8126f2d971de294296cfe; docs/dating-plan.md); Amendment 19 (6.4 decision
  # rule; OSF revision 6ae89915263740bb19d84cc0)
  model: multinomial_logistic_l2
  first_year: 1473
  last_year: 1830
  merged_until: 1530            # 1473-1529 is one bin (383 volumes); then decades
  bin_years: 10                 # the last bin is 1820-1830
  segment_words: 2000           # as the Book of Mormon's fixed chunks (4.5)
  segments_per_volume: 2
  min_function_share: 0.2       # a segment is prose if 20% of its tokens are function words
  train_volumes_per_bin: 1500
  validation_volumes_per_bin: 375
  validation_share: 0.2         # of authors (volumes without one), by seeded hash
  validation_seed: bom29-validation
  sample_seed: bom29-sample
  fit_seed: bom29-fit
  penalty_grid: [0.01, 0.1, 1.0, 10.0]   # inverse L2 strength, chosen by grouped CV log loss
  cv_folds: 5
  max_iter: 2000
  lexical_vocabulary: 5000      # most document-frequent words of the training segments
  interval: 0.90                # 6.4
  window: [1780, 1830]          # 6.4, H3a
  window_share: 0.8             # 6.4: dated to a window if 80% of segments' intervals fall in it
  # Amendment 19 (post hoc, after validation, before any Book of Mormon scoring): H3a/H3b are
  # decided on segment median years, as H3a is worded; the interval rule above is reported beside
  decision: segment_median
  majority_share: 0.5           # H3a/H3b: more than half of segments' median years in the window
  early_window: [1473, 1700]    # H3b
  h3c_min_p: 0.05               # 6.4: H3c accepted if the permutation p is above this
  permutations: 10000           # Amendment 2
  permutation_seed: bom29-permutation
  keyed_check_years: [1780, 1809]   # keyed (TCP) and OCR volumes of the same decades
  transformer_size: base         # Amendment 29 (OSF 6aee207dbe8fc50aaf6a0f54): the cross-check
  transformer_window: 512


sweep:
  # Amendment 28 (OSF revision 6aee07a58d69291fd76cc3f8; docs/sweep-plan.md): BOM-39 and BOM-47
  min_words: 10000              # section 7 floor, non-duplicate volumes
  block_words: 1000
  max_blocks: 20                # profile sample cap: 20,000 words, round-robin over works
  block_seed: bom39-blocks
  mfw: 300                      # the registered middle MFW value
