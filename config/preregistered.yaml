  draw_seed: a58-lists
  similar_mfw: 300                # similar lists: nearest by Cosine Delta on training profiles
  gi_seed: a58-gi
  bars: [0.90, 0.70]
  top_k: [1, 3, 5, 10]            # our models: true author among the closest k (added before their scores)
  tournament:                     # BOM-93 (exploratory): heats, then a final
    heats: [[5, 11, 4], [5, 11, 2], [11, 5, 2], [11, 5, 1]]   # [heats, heat size, kept per heat]
    draws: 20                     # random heat assignments per passage
    pooled: [1, 2, 3, 5, 8]       # non-overlapping passages averaged
    seed: bom93-tournament
  normalised:                     # BOM-90 follow-up (exploratory, post hoc): each model's score on its own scale
    later_prefix: p3_             # Amendment 56's 32 authors; the rest are BOM-75's 23
    pooled: [1, 2, 3, 5, 8]
    draws: 40
    seed: bom90-normalised
    out: data/benchmark/list_size_normalised.json
  decision_size: 12               # the Book of Mormon's list; sign test by author, Holm over 12
  resamples: 5000
  resample_seed: a58-authors
  alpha: 0.05
  out: data/benchmark/list_size.json

sweep_search:
  gi_shortlist: 100               # step 0: General Imposters on each book's 100 closest (Cosine Delta)
  gi_pool: 500                    # seeded random profiles, the candidate excluded
  gi_pool_seed: a57-gi-pool
  unknown_share: 0.10             # blocks trained under the "unknown author" label
  unknown_seed: a57-unknown
  leak_share: 0.15                # drop a training block sharing > 15% of a query chunk's 5-grams
  size: base
  epochs: 2
  peak_lr: 1.0e-4
  warmup_share: 0.02
  final_lr_share: 0.10
  batch_tokens: 524288
  shortlist_each: 500             # union of the 500 closest by Cosine Delta and by the style encoder
  seed: a57-train

