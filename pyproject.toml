[project]
name = "bom-authorship"
version = "0.1.0"
description = "Book of Mormon Authorship: an open, pre-registered computational study of the earliest Book of Mormon text"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Dave Taylor" }]
dependencies = [
    "huggingface-hub>=2.2.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ingest",
    "metadata",
    "ocr_fix",
    "kjv_mask",
    "segment",
    "classic",
    "reuse",
    "semantic",
    "timelocked_lm",
    "alm",
    "dating",
    "style_embed",
    "eval",
    "paper",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
